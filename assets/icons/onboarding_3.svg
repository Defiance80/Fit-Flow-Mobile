<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#0D9488" opacity="0.1"/>
  
  <!-- Trophy -->
  <g transform="translate(110, 60)">
    <!-- Trophy cup -->
    <path d="M20,20 L20,40 Q20,50 30,50 L50,50 Q60,50 60,40 L60,20 L55,20 L55,15 Q55,10 50,10 L30,10 Q25,10 25,15 L25,20 Z" fill="#F97316"/>
    <!-- Trophy handles -->
    <path d="M20,25 Q15,25 15,30 Q15,35 20,35" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M60,25 Q65,25 65,30 Q65,35 60,35" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Trophy base -->
    <rect x="25" y="50" width="30" height="8" rx="4" fill="#1E293B"/>
    <rect x="30" y="58" width="20" height="5" rx="2" fill="#1E293B"/>
  </g>
  
  <!-- Progress chart -->
  <g transform="translate(80, 120)">
    <!-- Chart bars -->
    <rect x="0" y="40" width="15" height="20" fill="#1E293B"/>
    <rect x="20" y="30" width="15" height="30" fill="#0D9488"/>
    <rect x="40" y="20" width="15" height="40" fill="#F97316"/>
    <rect x="60" y="10" width="15" height="50" fill="#0D9488"/>
    <rect x="80" y="5" width="15" height="55" fill="#F97316"/>
    
    <!-- Chart axes -->
    <line x1="0" y1="65" x2="100" y2="65" stroke="#1E293B" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="65" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Arrow pointing up -->
    <path d="M110,30 L120,20 L130,30" fill="none" stroke="#0D9488" stroke-width="3"/>
    <line x1="120" y1="20" x2="120" y2="60" stroke="#0D9488" stroke-width="3"/>
  </g>
  
  <!-- Target/Goal symbol -->
  <g transform="translate(200, 100)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="none" stroke="#0D9488" stroke-width="2"/>
    <circle cx="20" cy="20" r="2" fill="#F97316"/>
  </g>
  
  <!-- Achievement badges -->
  <g transform="translate(60, 200)">
    <!-- Badge 1 -->
    <circle cx="15" cy="15" r="12" fill="#F97316"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
    
    <!-- Badge 2 -->
    <circle cx="45" cy="15" r="12" fill="#0D9488"/>
    <text x="45" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
    
    <!-- Badge 3 -->
    <circle cx="75" cy="15" r="12" fill="#1E293B"/>
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">10</text>
    
    <!-- Star -->
    <g transform="translate(110, 0)">
      <path d="M15,5 L18,12 L25,12 L19.5,17 L21.5,24 L15,19.5 L8.5,24 L10.5,17 L5,12 L12,12 Z" fill="#F97316"/>
    </g>
    
    <!-- Crown -->
    <g transform="translate(150, 5)">
      <path d="M5,15 L10,10 L15,15 L20,8 L25,15 L25,20 L5,20 Z" fill="#F97316"/>
      <circle cx="15" cy="12" r="2" fill="#0D9488"/>
    </g>
  </g>
  
  <!-- Text "ACHIEVE GOALS" -->
  <text x="150" y="280" text-anchor="middle" fill="#0D9488" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ACHIEVE GOALS</text>
</svg>