<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#0D9488" opacity="0.1"/>
  
  <!-- Apple -->
  <g transform="translate(120, 80)">
    <!-- Apple body -->
    <path d="M30,20 C30,10 40,5 50,10 C60,5 70,10 70,20 C70,40 65,60 50,65 C35,60 30,40 30,20 Z" fill="#F97316"/>
    <!-- Apple leaf -->
    <path d="M50,10 Q55,5 60,10" stroke="#0D9488" stroke-width="2" fill="none"/>
    <!-- Apple stem -->
    <line x1="50" y1="10" x2="50" y2="5" stroke="#1E293B" stroke-width="2"/>
  </g>
  
  <!-- Plate with healthy food -->
  <g transform="translate(80, 140)">
    <!-- Plate -->
    <circle cx="70" cy="40" r="35" fill="white" stroke="#1E293B" stroke-width="2"/>
    <!-- Salad -->
    <circle cx="60" cy="35" r="8" fill="#0D9488"/>
    <circle cx="75" cy="35" r="6" fill="#F97316"/>
    <circle cx="65" cy="45" r="5" fill="#1E293B"/>
    <circle cx="80" cy="45" r="4" fill="#0D9488"/>
  </g>
  
  <!-- Water glass -->
  <g transform="translate(200, 120)">
    <!-- Glass -->
    <path d="M10,10 L10,50 Q10,55 15,55 L25,55 Q30,55 30,50 L30,10" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Water -->
    <path d="M12,15 L12,48 Q12,52 16,52 L24,52 Q28,52 28,48 L28,15" fill="#0D9488" opacity="0.6"/>
    <!-- Water level line -->
    <line x1="12" y1="15" x2="28" y2="15" stroke="#0D9488" stroke-width="1"/>
  </g>
  
  <!-- Nutrition icons -->
  <g transform="translate(60, 220)">
    <!-- Carrot -->
    <path d="M5,5 L5,25 Q5,30 10,30 Q15,30 15,25 L15,5" fill="#F97316"/>
    <path d="M8,0 L8,8" stroke="#0D9488" stroke-width="2"/>
    <path d="M12,0 L12,6" stroke="#0D9488" stroke-width="2"/>
    
    <!-- Broccoli -->
    <g transform="translate(40, 0)">
      <circle cx="5" cy="15" r="4" fill="#0D9488"/>
      <circle cx="10" cy="12" r="3" fill="#0D9488"/>
      <circle cx="8" cy="18" r="3" fill="#0D9488"/>
      <line x1="8" y1="22" x2="8" y2="30" stroke="#1E293B" stroke-width="3"/>
    </g>
    
    <!-- Avocado -->
    <g transform="translate(80, 0)">
      <ellipse cx="8" cy="15" rx="6" ry="10" fill="#0D9488"/>
      <circle cx="8" cy="15" r="4" fill="#F97316"/>
    </g>
    
    <!-- Fish -->
    <g transform="translate(120, 5)">
      <path d="M0,10 Q10,5 20,10 Q10,15 0,10" fill="#1E293B"/>
      <path d="M20,10 L25,5 L25,15 Z" fill="#1E293B"/>
      <circle cx="15" cy="10" r="1" fill="white"/>
    </g>
  </g>
  
  <!-- Text "EAT WELL" -->
  <text x="150" y="280" text-anchor="middle" fill="#0D9488" font-family="Arial, sans-serif" font-size="16" font-weight="bold">EAT WELL</text>
</svg>