<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#0D9488" opacity="0.1"/>
  
  <!-- Dumbbell -->
  <g transform="translate(100, 120)">
    <rect x="0" y="25" width="15" height="50" rx="7" fill="#1E293B"/>
    <rect x="85" y="25" width="15" height="50" rx="7" fill="#1E293B"/>
    <rect x="15" y="45" width="70" height="10" rx="5" fill="#0D9488"/>
    <circle cx="7.5" cy="35" r="8" fill="#F97316"/>
    <circle cx="7.5" cy="65" r="8" fill="#F97316"/>
    <circle cx="92.5" cy="35" r="8" fill="#F97316"/>
    <circle cx="92.5" cy="65" r="8" fill="#F97316"/>
  </g>
  
  <!-- Person exercising silhouette -->
  <g transform="translate(130, 80)">
    <!-- Head -->
    <circle cx="20" cy="20" r="12" fill="#1E293B"/>
    <!-- Body -->
    <rect x="15" y="32" width="10" height="30" rx="5" fill="#1E293B"/>
    <!-- Arms -->
    <rect x="5" y="35" width="8" height="3" rx="1.5" fill="#1E293B"/>
    <rect x="27" y="35" width="8" height="3" rx="1.5" fill="#1E293B"/>
    <!-- Legs -->
    <rect x="16" y="62" width="3" height="20" rx="1.5" fill="#1E293B"/>
    <rect x="21" y="62" width="3" height="20" rx="1.5" fill="#1E293B"/>
  </g>
  
  <!-- Heart rate line -->
  <g transform="translate(50, 200)">
    <path d="M0,20 L20,20 L30,5 L40,35 L50,10 L60,25 L80,25 L100,25 L120,5 L130,30 L140,15 L160,15 L200,15" 
          stroke="#F97316" stroke-width="3" fill="none"/>
    <circle cx="30" r="3" fill="#F97316"/>
    <circle cx="120" r="3" fill="#F97316"/>
  </g>
  
  <!-- Text "GET FIT" -->
  <text x="150" y="280" text-anchor="middle" fill="#0D9488" font-family="Arial, sans-serif" font-size="16" font-weight="bold">GET FIT</text>
</svg>