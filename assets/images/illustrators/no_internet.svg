<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1E293B" opacity="0.1"/>
  
  <!-- WiFi symbol with X -->
  <g transform="translate(100, 90)">
    <!-- WiFi arcs (disabled) -->
    <path d="M-40,-20 Q0,-60 40,-20" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.3"/>
    <path d="M-28,-10 Q0,-38 28,-10" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.3"/>
    <path d="M-16,0 Q0,-16 16,0" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.3"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="5" r="4" fill="#1E293B" opacity="0.3"/>
    
    <!-- X over WiFi -->
    <line x1="-35" y1="-35" x2="35" y2="25" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="-35" y2="25" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Router/modem icon -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="none" stroke="#0D9488" stroke-width="2"/>
    <circle cx="15" cy="10" r="3" fill="#F97316"/>
    <circle cx="30" cy="10" r="2" fill="#0D9488" opacity="0.3"/>
    <circle cx="45" cy="10" r="2" fill="#0D9488" opacity="0.3"/>
    
    <!-- Antenna -->
    <line x1="65" y1="0" x2="65" y2="-15" stroke="#0D9488" stroke-width="2"/>
    <line x1="75" y1="0" x2="75" y2="-10" stroke="#0D9488" stroke-width="2"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="2" fill="#0D9488" opacity="0.5"/>
  <circle cx="150" cy="50" r="3" fill="#F97316" opacity="0.5"/>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">No internet connection</text>
</svg>