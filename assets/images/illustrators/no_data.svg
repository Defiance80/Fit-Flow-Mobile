<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#0D9488" opacity="0.1"/>
  
  <!-- Empty folder/document -->
  <g transform="translate(60, 60)">
    <!-- Folder back -->
    <rect x="0" y="20" width="80" height="60" rx="8" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Folder tab -->
    <rect x="0" y="10" width="30" height="15" rx="4" fill="none" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Empty state lines -->
    <line x1="15" y1="40" x2="65" y2="40" stroke="#0D9488" stroke-width="2" opacity="0.3"/>
    <line x1="15" y1="50" x2="50" y2="50" stroke="#0D9488" stroke-width="2" opacity="0.3"/>
    <line x1="15" y1="60" x2="60" y2="60" stroke="#0D9488" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Search icon -->
  <g transform="translate(130, 40)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#F97316" stroke-width="3"/>
    <line x1="25" y1="25" x2="35" y2="35" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="2" fill="#F97316" opacity="0.5"/>
  <circle cx="150" cy="150" r="2" fill="#F97316" opacity="0.5"/>
  <circle cx="40" cy="150" r="3" fill="#0D9488" opacity="0.5"/>
  <circle cx="160" cy="60" r="2" fill="#0D9488" opacity="0.5"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">No data found</text>
</svg>