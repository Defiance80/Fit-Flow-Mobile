<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#F97316" opacity="0.1"/>
  
  <!-- Error symbol -->
  <circle cx="100" cy="100" r="50" fill="#F97316" opacity="0.2"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#F97316" stroke-width="4"/>
  
  <!-- X mark -->
  <line x1="80" y1="80" x2="120" y2="120" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="80" y2="120" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="3" fill="#0D9488"/>
  <circle cx="140" cy="140" r="3" fill="#0D9488"/>
  <circle cx="140" cy="60" r="2" fill="#F97316"/>
  <circle cx="60" cy="140" r="2" fill="#F97316"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Something went wrong</text>
</svg>